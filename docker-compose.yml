services:
  db:
    # Tag ghim cứng có chủ ý: nâng major PostgreSQL đòi migrate data directory,
    # không phải thứ nên đổi được bằng một biến môi trường.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ielts}
      POSTGRES_USER: ${DB_USER:-ielts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ielts}
    # KHÔNG publish port ở đây nữa. Trên VPS, mở 5432 ra ngoài là đặt sổ từ của cả nhóm
    # sau đúng một mật khẩu trong .env. Máy dev lấy lại cổng qua
    # docker-compose.override.yml — file đó KHÔNG copy lên VPS.
    volumes:
      - ielts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ielts} -d ${DB_NAME:-ielts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend FastAPI — bản duy nhất đang phục vụ. Bản Spring Boot (`backend/`, service
  # `app`) đã bị xoá sau khi port xong; lịch sử của nó còn trong git nếu cần tra.
  api-service:
    # Context là GỐC REPO, không phải `./api-service`: Dockerfile có một stage Node dựng SPA
    # từ `packages/core` + `apps/web`, và cả hai nằm ngoài `api-service/`.
    #
    # Đây là cái giá của ràng buộc #15 — web app phải tồn tại ở CẢ hai đường deploy, và
    # đường Docker chỉ lấy được nó nếu build context nhìn thấy monorepo.
    build:
      context: .
      dockerfile: api-service/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # DB_HOST=db và DB_PORT=5432 là toạ độ trong mạng nội bộ của compose —
      # KHÔNG dùng ${DB_PORT} của .env ở đây, biến đó là cổng publish trên host.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ielts}
      DB_USER: ${DB_USER:-ielts}
      DB_PASSWORD: ${DB_PASSWORD:-ielts}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Thiếu ba dòng này thì đặt GEMINI_*_TIMEOUT_SECONDS trong .env KHÔNG có tác dụng
      # gì khi chạy bằng Docker, mà cũng không có cảnh báo nào — trong khi README và
      # .env.example đều nói là có. Mặc định ở đây phải khớp default trong app/config.py.
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS:-30}
      GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS:-20}
      EXTENSION_ID: ${EXTENSION_ID}
      # --- Đăng nhập Google ---
      # Thiếu những dòng này thì đặt AUTH_* trong .env KHÔNG có tác dụng khi chạy bằng
      # Docker, và cũng không có cảnh báo nào.
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}
      # Migration V6 backfill vocab_entry.user_id theo biến này. Không có nó thì app KHÔNG
      # khởi động được — cố ý, vì chạy migration với một email đoán bừa sẽ gán toàn bộ sổ
      # từ cho một tài khoản không ai đăng nhập được, mà migration thì không chạy lại.
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-60}
      AUTH_DAILY_GEMINI_CALLS: ${AUTH_DAILY_GEMINI_CALLS:-300}
      # --- Web app cùng origin ---
      # Cùng cái bẫy với AUTH_* ở trên: thiếu hai dòng này thì đặt chúng trong .env KHÔNG
      # có tác dụng khi chạy Docker, hoàn toàn im lặng. Mặc định phải khớp app/config.py.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://127.0.0.1:8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-auto}
      # Không có biến này thì tiến trình trong container chạy UTC, trong khi lịch ôn tính
      # "hôm nay" bằng ngày của hệ thống. Hệ quả: ngày ôn đổi lúc 07:00 sáng giờ VN thay
      # vì nửa đêm — hạn mức từ mới/ngày và due_date lệch theo. Chạy uvicorn thẳng trên
      # máy không dính vì tiến trình lấy luôn giờ của máy.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # KHÔNG publish port ở đây: Caddy đứng trước và nói chuyện với api-service qua mạng
    # nội bộ. Máy dev lấy lại cổng qua docker-compose.override.yml.

  caddy:
    # Caddy tự xin và tự gia hạn chứng chỉ Let's Encrypt. nginx thì phải cắm thêm certbot
    # và một cron gia hạn — nhiều thứ để quên hơn cho đúng một việc.
    image: caddy:2
    depends_on:
      - api-service
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  ielts_pgdata:
  caddy_data:
  caddy_config:
