services:
  db:
    # Tag ghim cứng có chủ ý: nâng major PostgreSQL đòi migrate data directory,
    # không phải thứ nên đổi được bằng một biến môi trường.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ielts}
      POSTGRES_USER: ${DB_USER:-ielts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ielts}
    ports:
      # DB_PORT chỉ đổi cổng publish ra host. Trong mạng compose luôn là 5432.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - ielts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ielts} -d ${DB_NAME:-ielts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # Cổng 5432 cứng ở đây là ĐÚNG: app nối tới db qua mạng nội bộ của compose,
      # không đi qua cổng publish trên host.
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-ielts}
      DB_USER: ${DB_USER:-ielts}
      DB_PASSWORD: ${DB_PASSWORD:-ielts}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EXTENSION_ID: ${EXTENSION_ID}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  ielts_pgdata:
