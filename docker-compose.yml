services:
  db:
    # Tag ghim cứng có chủ ý: nâng major PostgreSQL đòi migrate data directory,
    # không phải thứ nên đổi được bằng một biến môi trường.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ielts}
      POSTGRES_USER: ${DB_USER:-ielts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ielts}
    # KHÔNG publish port ở đây nữa. Trên VPS, mở 5432 ra ngoài là đặt sổ từ của cả nhóm
    # sau đúng một mật khẩu trong .env. Máy dev lấy lại cổng qua
    # docker-compose.override.yml — file đó KHÔNG copy lên VPS.
    volumes:
      - ielts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ielts} -d ${DB_NAME:-ielts}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      # DB_HOST=db và DB_PORT=5432 là toạ độ trong mạng nội bộ của compose —
      # KHÔNG dùng ${DB_PORT} của .env ở đây, biến đó là cổng publish trên host.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ielts}
      DB_USER: ${DB_USER:-ielts}
      DB_PASSWORD: ${DB_PASSWORD:-ielts}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Thiếu ba dòng này thì đặt GEMINI_*_TIMEOUT_SECONDS trong .env KHÔNG có tác dụng
      # gì khi chạy bằng Docker, mà cũng không có cảnh báo nào — trong khi README và
      # .env.example đều nói là có. Mặc định ở đây phải khớp default trong application.yml.
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS:-30}
      GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS:-20}
      EXTENSION_ID: ${EXTENSION_ID}
      # --- Đăng nhập Google ---
      # Thiếu những dòng này thì đặt AUTH_* trong .env KHÔNG có tác dụng khi chạy bằng
      # Docker, và cũng không có cảnh báo nào.
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}
      # Flyway V6 backfill vocab_entry.user_id theo biến này. Không có nó thì app KHÔNG
      # khởi động được — cố ý, vì chạy migration với một email đoán bừa sẽ gán toàn bộ sổ
      # từ cho một tài khoản không ai đăng nhập được, mà Flyway thì không chạy lại.
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-60}
      AUTH_DAILY_GEMINI_CALLS: ${AUTH_DAILY_GEMINI_CALLS:-300}
      # Không có biến này thì JVM trong container chạy UTC, trong khi lịch ôn tính
      # "hôm nay" bằng LocalDate.now() theo giờ hệ thống. Hệ quả: ngày ôn đổi lúc
      # 07:00 sáng giờ VN thay vì nửa đêm — hạn mức từ mới/ngày và due_date lệch
      # theo. Chạy backend từ IDE không dính vì JVM lấy luôn giờ của máy.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # Cũng không publish: Caddy đứng trước và nói chuyện với app qua mạng nội bộ.
    # Máy dev lấy lại cổng qua docker-compose.override.yml.

  # Bản port sang Python/FastAPI. Chạy SONG SONG với `app` trên cùng một Postgres có chủ
  # ý: hai backend nói cùng một schema, nên so sánh hành vi là gọi lần lượt hai cổng chứ
  # không phải dựng hai bộ dữ liệu. Migration append-only (ràng buộc #8) là thứ khiến điều
  # này an toàn — bên nào khởi động trước cũng dựng ra đúng một schema, bên còn lại nhận ra
  # và không chạy lại.
  #
  # Chưa nối vào Caddy: `app` vẫn là bản đang phục vụ thật. Đổi reverse_proxy trong
  # Caddyfile sang api-service:8080 là bước cắt sang, làm khi đã đối chiếu xong.
  api-service:
    build: ./api-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ielts}
      DB_USER: ${DB_USER:-ielts}
      DB_PASSWORD: ${DB_PASSWORD:-ielts}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-15}
      GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS:-30}
      GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS: ${GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS:-20}
      EXTENSION_ID: ${EXTENSION_ID}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS}
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL}
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-60}
      AUTH_DAILY_GEMINI_CALLS: ${AUTH_DAILY_GEMINI_CALLS:-300}
      # Cùng lý do như service `app`: lịch ôn tính "hôm nay" theo giờ hệ thống, container
      # chạy UTC sẽ làm ngày ôn đổi lúc 07:00 sáng giờ VN thay vì nửa đêm.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

  caddy:
    # Caddy tự xin và tự gia hạn chứng chỉ Let's Encrypt. nginx thì phải cắm thêm certbot
    # và một cron gia hạn — nhiều thứ để quên hơn cho đúng một việc.
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  ielts_pgdata:
  caddy_data:
  caddy_config:
