# Mọi giá trị đều override được bằng biến môi trường; default trong file là cấu
# hình chạy local (backend ngoài container, Postgres qua cổng publish trên host).
# Xem .env.example ở thư mục gốc để biết bộ biến đầy đủ.

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ielts-translator
  datasource:
    # DB_URL thắng nếu được set — docker compose set nó thành db:5432 (mạng nội
    # bộ). Không có DB_URL thì ghép từ mảnh, dùng cho lần chạy ngoài container:
    # khi đó DB_PORT chính là cổng publish trên host.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ielts}}
    username: ${DB_USER:ielts}
    password: ${DB_PASSWORD:ielts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
  retry-backoff-millis: ${GEMINI_RETRY_BACKOFF_MS:1000}

extension:
  id: ${EXTENSION_ID:}
