# Mọi giá trị đều override được bằng biến môi trường; default trong file là cấu
# hình chạy local (backend ngoài container, Postgres qua cổng publish trên host).
# Xem .env.example ở thư mục gốc để biết bộ biến đầy đủ.

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  # Nạp .env ở thư mục gốc repo vào Environment. Đặt ở ĐÂY chứ không phải trong
  # application-local.yml, vì profile "local" chỉ bật khi dùng đúng một run config
  # cụ thể — bấm mũi tên xanh cạnh hàm main thì IntelliJ sinh config tạm không có
  # profile nào, và .env sẽ không bao giờ được đọc.
  #
  # Hai ứng viên vì working directory khác nhau tuỳ cách chạy:
  #   backend/     -> run config "Backend local", mvn spring-boot:run trong backend/
  #   thư mục gốc  -> config tạm IntelliJ tự sinh (mặc định $PROJECT_DIR$)
  # optional: nên trong container (không có .env, biến đến từ compose) vẫn chạy.
  config:
    import:
      - "optional:file:../.env[.properties]"
      - "optional:file:./.env[.properties]"
  application:
    name: ielts-translator
  datasource:
    # Ghép phẳng từ mảnh, không lồng placeholder. docker compose set DB_HOST=db
    # và DB_PORT=5432 (cổng trong mạng nội bộ). Chạy ngoài container thì mặc định
    # localhost + DB_PORT của .env, tức cổng publish trên host.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ielts}
    username: ${DB_USER:ielts}
    password: ${DB_PASSWORD:ielts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    placeholders:
      # Email chủ sở hữu dữ liệu cũ — V6 dùng nó để backfill vocab_entry.user_id.
      # KHÔNG đặt default: chạy migration với một email đoán bừa sẽ gán toàn bộ sổ từ cho
      # một tài khoản không ai đăng nhập được, mà Flyway thì không chạy lại.
      bootstrap_email: ${AUTH_BOOTSTRAP_EMAIL}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
  # Ba mức vì độ dài output khác nhau một bậc. Dịch một từ vài trăm token; sinh một lô
  # 10 câu quiz vài nghìn. Xem GeminiTimeout.
  timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:15}
  quiz-generate-timeout-seconds: ${GEMINI_QUIZ_GENERATE_TIMEOUT_SECONDS:30}
  quiz-grade-timeout-seconds: ${GEMINI_QUIZ_GRADE_TIMEOUT_SECONDS:20}
  retry-backoff-millis: ${GEMINI_RETRY_BACKOFF_MS:1000}

extension:
  id: ${EXTENSION_ID:}

auth:
  google-client-id: ${AUTH_GOOGLE_CLIENT_ID:}
  # CHỈ sống ở backend. Không bao giờ được xuất hiện trong bundle extension.
  google-client-secret: ${AUTH_GOOGLE_CLIENT_SECRET:}
  google-token-url: ${AUTH_GOOGLE_TOKEN_URL:https://oauth2.googleapis.com}
  # Rỗng = KHÓA HẾT, cố ý: cấu hình thiếu phải làm hệ thống đóng lại chứ không mở toang
  # cho mọi tài khoản Google trên đời.
  allowed-emails: ${AUTH_ALLOWED_EMAILS:}
  # Redirect URI dựng từ đây, nên nó phải khớp EXTENSION_ID thật.
  extension-id: ${EXTENSION_ID:}
  session-days: ${AUTH_SESSION_DAYS:60}
  # 0 = tắt hạn mức (chỉ dùng ở máy dev).
  daily-gemini-calls: ${AUTH_DAILY_GEMINI_CALLS:300}
